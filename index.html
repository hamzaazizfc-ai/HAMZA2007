<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برجر هاوس | Burger House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ed;
  --bg-soft:#fff1e6;
  --card:#ffffff;
  --text:#1f140d;
  --muted:#6b5843;
  --brand:#e63b1f;
  --brand-2:#ff6b2b;
  --b2:#fbbf24;
  --line:#f5e6d6;
  --ok:#16a34a;
  --danger:#dc2626;
  --shadow:0 20px 45px -25px rgba(230, 59, 31, 0.55);
  --shadow-soft:0 12px 35px -20px rgba(31, 20, 13, 0.45);
  --radius:18px;
  --radius-lg:24px;
  --ease:cubic-bezier(.25,.8,.25,1);
  --ease-out:cubic-bezier(.25,1,.5,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15100c;
    --bg-soft:#1d140f;
    --card:#241a14;
    --text:#f6ece2;
    --muted:#b8a595;
    --line:#3d2f25;
    --shadow:0 25px 50px -30px rgba(230, 59, 31, 0.7);
    --shadow-soft:0 18px 40px -25px rgba(15, 10, 7, 0.9);
  }
}
:root[data-theme="dark"]{
  --bg:#15100c;
  --bg-soft:#1d140f;
  --card:#241a14;
  --text:#f6ece2;
  --muted:#b8a595;
  --line:#3d2f25;
  --shadow:0 25px 50px -30px rgba(230, 59, 31, 0.7);
  --shadow-soft:0 18px 40px -25px rgba(15, 10, 7, 0.9);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(120% 120% at 50% 0%, var(--bg-soft) 0%, var(--bg) 55%, var(--bg) 100%);
  color:var(--text);
  font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
header{
  position:sticky;
  top:0;
  z-index:20;
  background:linear-gradient(135deg,var(--brand) 0%, var(--brand-2) 100%);
  color:#fff;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 18px 40px -20px rgba(230, 59, 31, 0.9);
  backdrop-filter:saturate(1.08);
}
header h1{
  margin:0;
  font-size:20px;
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:700;
  letter-spacing:-0.01em;
}
.logo{
  display:flex;
  width:52px;
  height:52px;
  border-radius:50%;
  box-shadow:0 16px 35px -18px rgba(15, 9, 6, 0.9);
  flex:0 0 auto;
  border:2px solid rgba(255,255,255,0.4);
  overflow:hidden;
  animation:float 6s ease-in-out infinite;
}
.logo svg{width:100%;height:100%}
header button{
  background:rgba(255,255,255,0.22);
  border:1px solid rgba(255,255,255,0.32);
  color:#fff;
  border-radius:999px;
  padding:8px 12px;
  margin-inline-start:8px;
  cursor:pointer;
  font-family:inherit;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:transform .25s var(--ease-out), background .25s var(--ease-out), box-shadow .25s var(--ease-out);
  box-shadow:0 12px 30px -16px rgba(15, 9, 6, 0.8);
}
header button:hover{transform:translateY(-2px);background:rgba(255,255,255,0.32)}
header button:active{transform:translateY(-1px) scale(.98)}
.tabs{
  display:flex;
  gap:8px;
  padding:14px 18px 0;
  max-width:1080px;
  margin:auto;
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;
  padding:9px 16px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  white-space:nowrap;
  box-shadow:var(--shadow-soft);
  transition:all .25s var(--ease-out);
  display:flex;
  align-items:center;
  gap:8px;
}
.tab:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.tab.on{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;
  border-color:transparent;
  box-shadow:var(--shadow);
}
.bd{
  background:rgba(255,255,255,0.26);
  color:#fff;
  border-radius:999px;
  padding:1px 9px;
  margin-inline-start:4px;
  font-size:12px;
  font-weight:700;
}
.tab:not(.on) .bd{
  background:rgba(230, 59, 31, 0.16);
  color:var(--brand);
}
main{max-width:1080px;margin:auto;padding:16px 20px 56px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
  margin-top:16px;
  perspective:1200px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:16px;
  margin-bottom:12px;
  position:relative;
  box-shadow:var(--shadow-soft);
  transition:transform .3s var(--ease-out), box-shadow .3s var(--ease-out), border-color .3s var(--ease-out);
  animation:fade-up .6s var(--ease-out) both;
  will-change:transform;
}
.grid .card{
  margin:0;
  cursor:pointer;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.grid .card:nth-child(2n){animation-delay:.08s}
.grid .card:nth-child(3n){animation-delay:.16s}
.grid .card:hover{
  transform:translateY(-10px) rotate3d(1,0,0,1deg);
  box-shadow:var(--shadow);
  border-color:rgba(230, 59, 31, 0.4);
}
.em{font-size:54px;text-align:center;filter:drop-shadow(0 18px 30px rgba(31,20,13,0.12))}
.ph{
  display:block;
  width:calc(100% + 32px);
  margin:-16px -16px 4px;
  aspect-ratio:4/3;
  object-fit:cover;
  background:linear-gradient(180deg, rgba(245,230,214,0.8), rgba(255,247,237,0));
  transition:transform .4s var(--ease-out);
}
.grid .card:hover .ph{transform:scale(1.05)}
#modal .ph{width:100%;margin:0 0 10px;border-radius:var(--radius)}
.card h3{margin:2px 0 2px;font-size:18px;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:14px}
.pr{font-weight:700;color:var(--brand);display:inline-flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.stars span{cursor:pointer;font-size:22px;color:#d9c9b5;transition:color .2s var(--ease-out), transform .2s var(--ease-out)}
.stars span.f{color:var(--b2);text-shadow:0 6px 14px rgba(251,191,36,0.4)}
.stars span:hover{transform:scale(1.25)}
.avg{font-size:13px;color:var(--muted)}
.btn{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;
  border:0;
  border-radius:999px;
  padding:10px 18px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
  box-shadow:var(--shadow);
  transition:transform .25s var(--ease-out), box-shadow .25s var(--ease-out), filter .25s var(--ease-out);
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn:hover{transform:translateY(-4px);box-shadow:0 24px 45px -25px rgba(230,59,31,0.9)}
.btn:active{transform:translateY(-2px) scale(.98)}
.btn.g{background:linear-gradient(135deg,var(--ok),#22c55e);box-shadow:0 20px 40px -24px rgba(22,163,74,0.9)}
.btn.o{background:transparent;color:var(--brand);border:1px solid rgba(230,59,31,0.5);box-shadow:none}
.btn.o:hover{box-shadow:0 16px 35px -24px rgba(230,59,31,0.5)}
.btn.s{padding:7px 14px;font-size:13px;border-radius:999px}
.qty{display:flex;align-items:center;gap:10px;background:var(--bg-soft);border-radius:999px;padding:4px 10px;border:1px solid var(--line)}
.qty button{
  width:32px;
  height:32px;
  border-radius:50%;
  border:1px solid transparent;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;
  font-size:18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 14px 30px -18px rgba(230,59,31,0.9);
  transition:transform .2s var(--ease-out);
}
.qty button:hover{transform:scale(1.08)}
input,textarea,select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  font-size:15px;
  font-family:inherit;
  margin-top:8px;
  transition:border-color .25s var(--ease-out), box-shadow .25s var(--ease-out);
}
input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:rgba(230,59,31,0.6);
  box-shadow:0 0 0 4px rgba(230,59,31,0.12);
}
input[type=checkbox]{width:auto;margin:0 8px}
.chips{display:flex;gap:10px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  padding:7px 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
  box-shadow:var(--shadow-soft);
  transition:all .25s var(--ease-out);
}
.chip:hover{transform:translateY(-3px)}
.chip.on{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;
  border-color:transparent;
  box-shadow:var(--shadow);
}
.promo{
  background:linear-gradient(90deg,var(--b2),#f59e0b);
  color:#1f140d;
  border-radius:var(--radius);
  padding:10px 16px;
  margin-bottom:12px;
  font-weight:700;
  box-shadow:0 16px 35px -22px rgba(245,158,11,0.9);
  animation:glow 3s ease-in-out infinite;
}
.av{
  position:absolute;
  top:12px;
  inset-inline-start:12px;
  background:linear-gradient(135deg,var(--ok),#22c55e);
  color:#fff;
  border-radius:999px;
  padding:4px 12px;
  font-size:12px;
  font-weight:700;
  z-index:2;
  box-shadow:0 12px 25px -16px rgba(22,163,74,0.9);
}
.card.off{opacity:.6}
.card.off .ph{filter:grayscale(1)}
.th{
  width:64px;
  height:64px;
  border-radius:14px;
  object-fit:cover;
  background:var(--bg-soft);
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  box-shadow:var(--shadow-soft);
}
.pv{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:var(--radius);margin-top:8px;background:var(--bg-soft)}
.old{color:var(--muted);font-weight:400;font-size:.88em;text-decoration:line-through}
.deal{
  position:absolute;
  top:42px;
  inset-inline-start:12px;
  background:linear-gradient(135deg,#dc2626,#ef4444);
  color:#fff;
  border-radius:999px;
  padding:4px 12px;
  font-size:12px;
  font-weight:700;
  z-index:2;
  box-shadow:0 14px 30px -18px rgba(220,38,38,0.95);
}
.pill{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-inline-start:6px}
.strip{display:flex;gap:16px;overflow-x:auto;padding:6px 6px 14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .card{flex:0 0 240px;margin:0;cursor:pointer;overflow:hidden}
.so{
  position:absolute;
  z-index:2;
  top:12px;
  inset-inline-start:12px;
  background:rgba(31,20,13,0.7);
  color:#fff;
  border-radius:999px;
  padding:4px 12px;
  font-size:12px;
  font-weight:700;
  backdrop-filter:blur(6px);
}
.heart{
  position:absolute;
  top:10px;
  inset-inline-end:12px;
  font-size:22px;
  cursor:pointer;
  filter:drop-shadow(0 10px 18px rgba(31,20,13,0.25));
  transition:transform .2s var(--ease-out);
  z-index:2;
}
.heart:hover{transform:scale(1.2)}
.st{
  display:inline-block;
  padding:4px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  background:linear-gradient(135deg,var(--b2),#f59e0b);
  color:#1f140d;
  box-shadow:0 12px 24px -16px rgba(245,158,11,0.9);
}
.st.s1,.st.s2{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff}
.st.s3{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
.st.s4{background:linear-gradient(135deg,var(--ok),#22c55e);color:#fff}
.st.s-1{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff}
.muted{color:var(--muted);font-size:14px}
h2{font-size:20px;margin:22px 0 10px;font-weight:700}
.toast{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  inset-inline:16px;
  z-index:60;
  background:linear-gradient(135deg,var(--ok),#22c55e);
  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  text-align:center;
  font-weight:700;
  box-shadow:0 25px 50px -25px rgba(22,163,74,0.95);
  animation:toast-in .35s var(--ease-out);
}
.toast.err{background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:0 25px 50px -25px rgba(220,38,38,0.95)}
#dlv{
  position:fixed;
  inset-inline:16px;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  z-index:70;
  background:linear-gradient(135deg,var(--ok),#22c55e);
  color:#fff;
  border-radius:var(--radius-lg);
  padding:20px;
  text-align:center;
  box-shadow:0 30px 60px -30px rgba(22,163,74,0.95);
  animation:fade-up .4s var(--ease-out);
}
#dlv .big{font-size:22px;font-weight:700;margin-bottom:6px}
#dlv .btn{background:#fff;color:#1f140d;margin-top:12px;box-shadow:none}
#modal{
  position:fixed;
  inset:0;
  background:radial-gradient(120% 120% at 50% 0%, rgba(31,20,13,0.4), rgba(15,10,7,0.7));
  backdrop-filter:blur(4px);
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  animation:fade-in .25s var(--ease-out);
}
#modal>div{
  background:var(--card);
  border-radius:var(--radius-lg);
  padding:22px;
  max-width:480px;
  width:100%;
  max-height:92%;
  overflow:auto;
  box-shadow:0 40px 70px -40px rgba(15,10,7,0.9);
  border:1px solid var(--line);
  animation:modal-in .35s var(--ease-out);
  scrollbar-width:none;
}
#modal>div::-webkit-scrollbar{display:none}
.fl{display:block;font-size:14px;color:var(--muted);margin-top:10px}
.bar{
  height:12px;
  background:linear-gradient(90deg,var(--brand),var(--brand-2));
  border-radius:999px;
  box-shadow:0 12px 24px -16px rgba(230,59,31,0.9);
}
ul{padding-inline-start:22px;margin:10px 0}
li{margin:4px 0}
@media (max-width:680px){
  header{padding:10px 14px}
  header h1{font-size:18px}
  main{padding:12px 14px 48px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  #modal>div{padding:18px}
}
@media print{
  body>*:not(#modal){display:none!important}
  #modal{position:static;background:none;backdrop-filter:none}
  #modal>div{box-shadow:none;border:none;max-width:100%}
  .noprint{display:none}
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
@keyframes fade-up{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes modal-in{
  from{opacity:0;transform:translateY(18px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes toast-in{
  from{opacity:0;transform:translateY(-12px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes glow{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.08)}
}
</style>
</head>
